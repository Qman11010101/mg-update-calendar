name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # update.ymlから更新後に呼び出す
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 呼び出し時はupdate.ymlがpushした最新のmainを取得する
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.ref_name }}

      # 公開するのはサイト本体のみ（README等は含めない）
      - name: Collect site files
        run: |
          mkdir _site
          cp -r docs/index.html docs/calendar.js docs/lib docs/style.css docs/entries.json _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
